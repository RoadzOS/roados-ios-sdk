# XcodeGen spec for the RoadOS iOS sample app. The generated
# RoadOSDemo.xcodeproj is committed, so XcodeGen is only needed to change it:
#   brew install xcodegen && xcodegen generate
name: RoadOSDemo
options:
  bundleIdPrefix: com.roadzos.sample
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RoadOSGraphics:
    path: ../..
targets:
  RoadOSDemo:
    type: application
    platform: iOS
    sources: [RoadOSDemo]
    dependencies:
      - package: RoadOSGraphics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadzos.sample.RoadOSDemo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RoadOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # The RoadOSCore xcframework ships arm64 slices only (Apple-silicon simulators and devices).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        CODE_SIGN_STYLE: Automatic
